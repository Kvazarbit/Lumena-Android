name: ci2296 phone report diagnostics

on:
  push:
    branches: [ "codex/phone-report-2296-diagnostics" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify diagnostic evidence collector
        run: python -m unittest discover -s scripts -p test_phone_report_diagnostics.py -v
      - name: Verify unchanged production baseline
        run: git diff --exit-code 437592cac33ec76d018afe05aec7be1ca4686547 -- app/src/main
      - name: Sync pinned native build configuration
        run: bash scripts/sync_llama_cpp.sh
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Execute desired-behavior assertions on ci2296
        id: assertions
        continue-on-error: true
        run: >-
          gradle --max-workers=2 -PphoneDiagnostics=true :app:testDebugUnitTest
          --tests 'com.lumena.android.diagnostics.*'
      - name: Classify actual assertions and reject infrastructure failures
        run: python scripts/phone_report_diagnostics.py
      - name: Upload diagnostic evidence (not an APK or a fix)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci2296-phone-report-diagnostics
          path: |
            app/build/phone-report-diagnostics/
            app/build/test-results/testDebugUnitTest/TEST-com.lumena.android.diagnostics.*.xml
          if-no-files-found: error
