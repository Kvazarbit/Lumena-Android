name: Project memory regression

on:
  push:
    branches: [ "codex/daily-project-memory", "codex/verified-collaboration-handoff", "feature/collaboration-local-state-card", "codex/daily-context-os-v1" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Sync pinned native configuration
        run: bash scripts/sync_llama_cpp.sh
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Verify all former diagnostic assertions and memory lifecycle
        run: >-
          gradle --max-workers=2 -PphoneDiagnostics=true :app:testDebugUnitTest
          --tests 'com.lumena.android.diagnostics.*'
          --tests 'com.lumena.android.agent.core.OwnerActionTextTest'
          --tests 'com.lumena.android.ollama.WorkflowRunnerSemanticRecallTest'
          --tests 'com.lumena.android.collaboration.*'
          --tests 'com.lumena.android.ollama.WorkflowRunnerCollaborationAdapterTest'
          --tests 'com.lumena.android.settings.LocalSessionSnapshotCodecTest'
          --tests 'com.lumena.android.settings.ProjectWorkspacePolicyTest'
          --tests 'com.lumena.android.settings.ProjectContinuationPolicyTest'
          --tests 'com.lumena.android.ollama.ProjectFilePreconditionsTest'
      - name: Verify nonempty passing JUnit reports
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          expected = {'PhoneReport2296DiagnosticTest': 11, 'EmbeddingLifecycleDiagnosticTest': 5,
                      'SemanticMemoryCoordinatorTest': 5, 'OwnerActionTextTest': 5,
                      'WorkflowRunnerSemanticRecallTest': 2, 'CollaborationProtocolTest': 5,
                      'CollaborationReviewTest': 3, 'CollaborationLedgerTest': 23,
                      'CollaborationStateCardTest': 15, 'WorkflowRunnerCollaborationAdapterTest': 4,
                      'ProjectContextClientTest': 3, 'LocalSessionSnapshotCodecTest': 3,
                      'ProjectWorkspacePolicyTest': 10, 'ProjectContinuationPolicyTest': 4,
                      'ProjectFilePreconditionsTest': 3, 'ProjectWorkspaceHistoryTest': 5}
          for name, minimum in expected.items():
              matches = list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.' + name + '.xml'))
              assert len(matches) == 1, name
              root = E.parse(matches[0]).getroot()
              assert int(root.get('tests', 0)) >= minimum, name
              assert all(int(root.get(k, 0)) == 0 for k in ('failures', 'errors', 'skipped')), name
              print('VERIFIED', name, root.get('tests'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-memory-regression
          path: app/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: error
      - name: Kill collaboration semantic mutants with exact-case oracles
        if: github.ref_name == 'codex/verified-collaboration-handoff' || github.ref_name == 'feature/collaboration-local-state-card' || github.ref_name == 'codex/daily-context-os-v1'
        run: python scripts/collaboration_probe.py
      - name: Kill file-CAS semantic mutant with an unrelated passing control
        run: python scripts/daily_context_file_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-context-file-probe
          path: app/build/daily-context-file-probe/
          if-no-files-found: error
      - name: Check private journal is excluded from Android backup and transfer
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          ns = '{http://schemas.android.com/apk/res/android}'
          app = E.parse('app/src/main/AndroidManifest.xml').getroot().find('application')
          assert app.get(ns+'fullBackupContent') == '@xml/backup_rules'
          assert app.get(ns+'dataExtractionRules') == '@xml/data_extraction_rules'
          expected = {('database', 'lumena_collaboration_v1.db'+s) for s in ('', '-journal', '-wal', '-shm')} | {('sharedpref', 'lumena_collaboration.xml')}
          old = E.parse('app/src/main/res/xml/backup_rules.xml').getroot()
          new = E.parse('app/src/main/res/xml/data_extraction_rules.xml').getroot()
          for node in (old, new.find('cloud-backup'), new.find('device-transfer')):
              assert expected <= {(e.get('domain'), e.get('path')) for e in node.findall('exclude')}
          print('VERIFIED backup privacy boundaries')
          PY
      - uses: actions/upload-artifact@v4
        if: always() && (github.ref_name == 'codex/verified-collaboration-handoff' || github.ref_name == 'feature/collaboration-local-state-card' || github.ref_name == 'codex/daily-context-os-v1')
        with:
          name: collaboration-semantic-probe
          path: app/build/collaboration-probe/
          if-no-files-found: error
