name: Android CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Vulkan host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc spirv-headers libvulkan-dev
      - name: Validate Termux bridge
        run: |
          python -m py_compile termux/bridge.py
          bash -n termux/install_bridge.sh
          bash -n termux/ollama_sidecar.sh
          bash -n scripts/sync_llama_cpp.sh
      - name: Sync pinned llama.cpp source
        run: bash scripts/sync_llama_cpp.sh
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Run agent core unit tests
        run: gradle --max-workers=2 testDebugUnitTest
      - name: Build debug APK
        run: gradle --max-workers=2 assembleDebug
      - name: Verify APK and embedded native library
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/liblumena_llama.so'
          unzip -p "$APK" lib/arm64-v8a/liblumena_llama.so > /tmp/liblumena_llama.so
          strings /tmp/liblumena_llama.so | grep -F 'llama.cpp embedded adaptive + vulkan'
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          mkdir -p dist
          cp "$APK" dist/Lumena-v0.12.0-arm64-debug.apk
          (cd dist && sha256sum Lumena-v0.12.0-arm64-debug.apk > SHA256SUMS.txt)
          printf 'App commit: %s\nllama.cpp commit: %s\n' "$(git rev-parse HEAD)" "$(git -C third_party/llama.cpp rev-parse HEAD)" > dist/BUILD-INFO.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumena-v0.12.0-arm64-debug
          path: dist/
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
