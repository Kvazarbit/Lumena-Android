name: Android CI

on:
  push:
    branches: [ main, "feature/**", "stabilize/**", "codex/**" ]
  pull_request:

permissions:
  contents: read

concurrency:
  # Same-repository draft PRs also trigger push; avoid duplicate SDK/native builds.
  group: android-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build host CPU bridge and test JNI failure boundaries
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/sync_llama_cpp.sh
          cmake -S third_party/llama.cpp -B /tmp/lumena-native-smoke \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_VULKAN=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_APP=OFF
          cmake --build /tmp/lumena-native-smoke --target llama -j 2
          g++ -std=c++17 -fPIC -shared app/src/main/cpp/lumena_llama.cpp \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -Ithird_party/llama.cpp/include -Ithird_party/llama.cpp/ggml/include \
            /tmp/lumena-native-smoke/src/libllama.a \
            /tmp/lumena-native-smoke/ggml/src/libggml.a \
            /tmp/lumena-native-smoke/ggml/src/libggml-cpu.a \
            /tmp/lumena-native-smoke/ggml/src/libggml-base.a \
            -fopenmp -pthread -ldl -lm -o /tmp/lumena-native-smoke/liblumena_llama.so
          mkfifo /tmp/lumena-native-smoke/model-pipe
          java --add-opens=java.base/java.io=ALL-UNNAMED \
            -Djava.library.path=/tmp/lumena-native-smoke \
            app/src/testNative/java/LlamaNative.java /tmp/lumena-native-smoke/model-pipe

  build:
    runs-on: ubuntu-latest
    # Full Kotlin recompilation for each mutation plus the native release build
    # can exceed 30 minutes on a cold runner. Keep all gates and per-probe limits.
    timeout-minutes: 90
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      LUMENA_SIGNING_BUNDLE: ${{ secrets.LUMENA_SIGNING_BUNDLE }}
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Vulkan host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc spirv-headers libvulkan-dev
      - name: Validate Termux bridge
        run: |
          python -m py_compile termux/bridge.py
          bash -n termux/install_laya_system1.sh
          grep -q '941e64863193c1290bffece6c22f8ac828dffecd' termux/install_laya_system1.sh
          grep -q '!defined(__ANDROID__)' termux/install_laya_system1.sh
          grep -q '#include <setjmp.h>' <(curl -fsSL https://raw.githubusercontent.com/shpati/laya.cpp/941e64863193c1290bffece6c22f8ac828dffecd/laya.c)
          python -m unittest discover -s termux -p 'test_*.py' -v
          python scripts/terminal_workflow_probe.py
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          repo_root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          os.environ["LUMENA_READONLY_ROOTS"] = str(repo_root)

          spec = importlib.util.spec_from_file_location("lumena_bridge", "termux/bridge.py")
          bridge = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(bridge)

          assert bridge.system_info()["ok"] is True
          assert bridge.file_list({})["ok"] is True

          alias = f"@{repo_root.name}"
          assert bridge.safe_read_path(alias, must_exist=True) == repo_root
          assert bridge.file_list({"path": alias, "depth": "1", "limit": "20"})["ok"] is True
          assert alias in bridge.workspace_listing()
          assert bridge.execute_tool("git.status", {"cwd": alias})["ok"] is True
          assert bridge.process_status({})["ok"] is True
          assert bridge.context_snapshot({"refresh": "true"})["ok"] is True

          batch = bridge.inspect_batch({
              "requests": [
                  {"tool": "health", "args": {}},
                  {"tool": "system.time", "args": {}},
                  {"tool": "git.status", "args": {"cwd": alias}},
              ]
          })
          assert batch["ok"] is True

          try:
              bridge.inspect_batch({
                  "requests": [{"tool": "file.write", "args": {"path": "x", "content": "bad"}}]
              })
          except ValueError:
              pass
          else:
              raise AssertionError("inspect.batch must reject mutating tools")

          try:
              bridge.safe_path(str(repo_root), must_exist=True)
          except ValueError:
              pass
          else:
              raise AssertionError("Read-only repo root must not be writable through safe_path")

          try:
              bridge._validated_public_https_url("http://example.com")
          except ValueError:
              pass
          else:
              raise AssertionError("http.json must reject non-HTTPS URLs")

          try:
              bridge._validated_public_https_url("https://127.0.0.1/test")
          except ValueError:
              pass
          else:
              raise AssertionError("http.json must reject loopback destinations")

          try:
              bridge.file_search({"query": ""})
          except ValueError:
              pass
          else:
              raise AssertionError("file.search must reject an empty query")

          try:
              bridge.image_search({"query": ""})
          except ValueError:
              pass
          else:
              raise AssertionError("image.search must reject an empty query")

          fake_payload = {
              "query": {
                  "pages": [{
                      "title": "File:Portrait.jpg",
                      "imageinfo": [{
                          "thumburl": "https://upload.wikimedia.org/example-thumb.jpg",
                          "url": "https://upload.wikimedia.org/example.jpg",
                          "descriptionurl": "https://commons.wikimedia.org/wiki/File:Portrait.jpg",
                          "mime": "image/jpeg",
                          "width": 1200,
                          "height": 800,
                      }],
                  }]
              }
          }

          class FakeResponse:
              headers = {}

              def __enter__(self):
                  return self

              def __exit__(self, exc_type, exc, tb):
                  return False

              def read(self, _limit):
                  import json
                  return json.dumps(fake_payload).encode("utf-8")

          class FakeOpener:
              def open(self, _request, timeout=None):
                  return FakeResponse()

          old_opener = bridge.PUBLIC_HTTPS_OPENER
          bridge.PUBLIC_HTTPS_OPENER = FakeOpener()
          try:
              image_result = bridge.image_search({
                  "query": "woman portrait",
                  "limit": "2",
              })
              assert image_result["ok"] is True
              image_payload = json.loads(image_result["stdout"])
              assert image_payload["display_ready"] is True
              assert len(image_payload["images"]) == 1
              assert image_payload["images"][0]["thumbnail_url"].startswith(
                  "https://upload.wikimedia.org/"
              )
              assert image_payload["images"][0]["source_page"].startswith(
                  "https://commons.wikimedia.org/"
              )
          finally:
              bridge.PUBLIC_HTTPS_OPENER = old_opener

          assert bridge._image_query_variants(
              "micro bikini beach photography"
          )[1] == "micro bikini beach"

          openverse_payload = {
              "results": [{
                  "id": "abc-123",
                  "title": "Beach portrait",
                  "thumbnail": "https://api.openverse.org/v1/images/abc-123/thumb/",
                  "filetype": "jpeg",
                  "width": 1024,
                  "height": 768,
                  "license": "cc-by",
                  "creator": "Example",
              }]
          }
          empty_wikimedia = {"query": {"pages": []}}

          class FallbackOpener:
              def open(self, request, timeout=None):
                  class Response:
                      def __init__(self, payload):
                          self.payload = payload
                          self.headers = {}

                      def __enter__(self):
                          return self

                      def __exit__(self, exc_type, exc, tb):
                          return False

                      def read(self, _limit):
                          return json.dumps(self.payload).encode("utf-8")

                  url = request.full_url
                  if "commons.wikimedia.org" in url:
                      return Response(empty_wikimedia)
                  if "api.openverse.org" in url:
                      return Response(openverse_payload)
                  raise AssertionError(f"unexpected image provider URL: {url}")

          old_opener = bridge.PUBLIC_HTTPS_OPENER
          bridge.PUBLIC_HTTPS_OPENER = FallbackOpener()
          try:
              fallback = bridge.image_search({
                  "query": "micro bikini beach photography",
                  "limit": "4",
              })
              assert fallback["ok"] is True
              fallback_payload = json.loads(fallback["stdout"])
              assert fallback_payload["display_ready"] is True
              assert "Openverse" in fallback_payload["providers_used"]
              assert "micro bikini beach" in fallback_payload["queries_tried"]
              assert len(fallback_payload["images"]) == 1
              assert fallback_payload["images"][0]["thumbnail_url"].startswith(
                  "https://api.openverse.org/"
              )
              assert fallback_payload["images"][0]["source_page"].startswith(
                  "https://openverse.org/image/"
              )
          finally:
              bridge.PUBLIC_HTTPS_OPENER = old_opener
          PY
          bash -n termux/install_bridge.sh
          bash -n termux/ollama_sidecar.sh
          bash -n scripts/sync_llama_cpp.sh
      - name: Validate PC preference benchmark and mutant source anchors
        run: |
          python -m unittest discover -s scripts -p 'test_listing_preference_benchmark.py' -v
          python -m unittest discover -s scripts -p 'test_sign_lumena.py' -v
          python -m py_compile scripts/sign_lumena.py
          python scripts/mutation_module_probe.py --dry-run
          python scripts/mutation_recovery_probe.py --dry-run
          python scripts/project_workspace_probe.py --dry-run
      - name: Sync pinned llama.cpp source
        run: bash scripts/sync_llama_cpp.sh
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Run agent core unit tests
        run: gradle --max-workers=2 testDebugUnitTest
      # Job logs need a GitHub sign-in; check-run annotations are public, so
      # failing test names stay visible to the owner without the gh CLI.
      - name: Annotate failed unit tests
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def esc(text):
              return text.replace("%", "%25").replace("\r", "").replace("\n", " ")

          base = Path("app/build/test-results/testDebugUnitTest")
          reports = sorted(base.glob("TEST-*.xml"))
          if not reports:
              print("::error title=No unit-test results::Compilation or Gradle failed before any test ran")
              raise SystemExit(0)
          failed = []
          for report in reports:
              for case in ET.parse(report).getroot().iter("testcase"):
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is None:
                      continue
                  lines = (problem.get("message") or problem.text or "").strip().splitlines()
                  short = case.get("classname", "").rsplit(".", 1)[-1] + "." + case.get("name", "")
                  failed.append((short, lines[0][:200] if lines else ""))
          print(f"FAILED_UNIT_TESTS={len(failed)}")
          for name, message in failed:
              print(f"FAILED {name}: {message}")
          if failed:
              names = ", ".join(name for name, _ in failed[:40])
              print(f"::error title=Failed unit tests ({len(failed)})::{esc(names)}")
              for name, message in failed[:8]:
                  print(f"::error title={esc(name)}::{esc(message)}")
          PY
      - name: Verify critical regression tests actually ran
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          base = Path("app/build/test-results/testDebugUnitTest")
          checks = [
              "com.lumena.android.agent.core.ExecutionClaimGuardTest",
              "com.lumena.android.agent.core.InlineSearchClaimSafetyTest",
              "com.lumena.android.agent.core.StandaloneWebSearchProtocolTest",
              "com.lumena.android.ollama.WorkflowRunnerExecutionReceiptTest",
              "com.lumena.android.ollama.WorkflowRunnerStandaloneWebSearchTest",
              "com.lumena.android.agent.core.TrustGateTest",
              "com.lumena.android.settings.CognitiveGenomeV0Test",
              "com.lumena.android.agent.core.BtcExecutionFalseDoneRegressionTest",
              "com.lumena.android.settings.SemanticMemoryPolicyTest",
              "com.lumena.android.settings.ContextMemoryIntegrityTest",
              "com.lumena.android.ollama.LocalEmbeddingProtocolTest",
              "com.lumena.android.agent.core.SemanticMemoryModuleBoundaryTest",
              "com.lumena.android.llama.SemanticLiteRtIdentityTest",
              "com.lumena.android.llama.LiteRtTextImportPolicyTest",
              "com.lumena.android.agent.core.SecretMaskerTest",
              "com.lumena.android.agent.local.ToolGateTrustTest",
              "com.lumena.android.ollama.WorkflowRunnerTrustGateTest",
              "com.lumena.android.agent.core.PythonRunApprovalTest",
              "com.lumena.android.ollama.WorkflowRunnerPythonApprovalTest",
              "com.lumena.android.companion.CompanionPythonApprovalTest",
              "com.lumena.android.settings.ProjectWorkspacePolicyTest",
              "com.lumena.android.settings.ProjectConversationPolicyTest",
              "com.lumena.android.agent.core.ProjectContextBudgetTest",
              "com.lumena.android.ollama.WorkflowRunnerProjectWorkspaceTest",
              "com.lumena.android.agent.core.ModelOperatingContractTest",
              "com.lumena.android.ollama.WorkflowRunnerTerminalContractTest",
              "com.lumena.android.ollama.CompletionReceiptWorkflowTest",
              "com.lumena.android.agent.core.OwnerActionTextTest",
              "com.lumena.android.ollama.WorkflowRunnerSemanticRecallTest",
              "com.lumena.android.collaboration.CollaborationProtocolTest",
              "com.lumena.android.collaboration.CollaborationReviewTest",
              "com.lumena.android.collaboration.CollaborationStateCardTest",
              "com.lumena.android.ollama.WorkflowRunnerCollaborationAdapterTest",
          ]
          total = 0
          for name in checks:
              p = base / f"TEST-{name}.xml"
              if not p.is_file():
                  raise SystemExit(f"MISSING_CRITICAL_TEST_SUITE: {name}")
              root = ET.parse(p).getroot()
              tests = int(root.get("tests", "0"))
              failures = int(root.get("failures", "0"))
              errors = int(root.get("errors", "0"))
              skipped = int(root.get("skipped", "0"))
              if tests <= 0 or failures or errors or skipped:
                  raise SystemExit(f"INVALID_CRITICAL_TEST_RESULT: {name}: "
                                   f"{tests=} {failures=} {errors=} {skipped=}")
              total += tests
              print(f"VERIFIED_REGRESSION {name}: {tests} passed")
          print(f"VERIFIED_CRITICAL_REGRESSION_TESTS={total}")
          PY
      # Capture UNMUTATED baseline results before mutation probes intentionally
      # cause JUnit assertions to fail as evidence that regressions were caught.
      - name: Upload unmutated baseline unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload terminal workflow falsification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-workflow-probe
          path: app/build/terminal-workflow-probe/
          if-no-files-found: ignore
      - name: Summarize cognitive contour audit
        if: always()
        shell: bash
        run: |
          if test -f app/build/cognitive-contour-audit/report.md; then
            cat app/build/cognitive-contour-audit/report.md
            cat app/build/cognitive-contour-audit/report.md >> "$GITHUB_STEP_SUMMARY"
            python -m json.tool app/build/cognitive-contour-audit/results.json >/dev/null
          else
            echo "Cognitive contour report unavailable (JVM tests may not have completed)."
          fi
      - name: Upload cognitive contour audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-contour-audit
          path: app/build/cognitive-contour-audit/
          if-no-files-found: ignore
      - name: Falsify project workspace context guarantees
        run: python scripts/project_workspace_probe.py --kotlin
      - name: Upload project workspace falsification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-workspace-probe
          path: app/build/project-workspace-probe/
          if-no-files-found: ignore
      - name: Probe recovery guard mutations
        run: python scripts/mutation_recovery_probe.py
      - name: Probe MCP and module/listing mutations
        run: python scripts/mutation_module_probe.py
      - name: Build unsigned release APK
        run: gradle --max-workers=2 assembleRelease
      - name: Verify embedded native library
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/liblumena_llama.so'
          unzip -p "$APK" lib/arm64-v8a/liblumena_llama.so > /tmp/liblumena_llama.so
          strings /tmp/liblumena_llama.so | grep -F 'llama.cpp embedded adaptive + vulkan'
          strings /tmp/liblumena_llama.so | grep -F 'load_policy=cpu-mmap-no-extra-bufts'
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
      - name: Sign with persistent owner key
        if: env.LUMENA_SIGNING_BUNDLE != ''
        run: |
          mkdir -p dist
          python scripts/sign_apk.py --apk app/build/outputs/apk/release/app-release-unsigned.apk --out dist/Lumena-v0.12.30-ci${GITHUB_RUN_NUMBER}-arm64.apk --apksigner "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cp signing/certificate.sha256 dist/CERTIFICATE-SHA256.txt
          printf 'App commit: %s\n' "$(git rev-parse HEAD)" > dist/BUILD-INFO.txt
      - name: Upload signed APK
        if: env.LUMENA_SIGNING_BUNDLE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Lumena-v0.12.30-ci${{ github.run_number }}-arm64
          path: dist/
          if-no-files-found: error
      - name: Prepare signing input when secret is not configured
        if: env.LUMENA_SIGNING_BUNDLE == ''
        run: |
          mkdir -p unsigned-input
          cp app/build/outputs/apk/release/app-release-unsigned.apk unsigned-input/
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" unsigned-input/
          printf 'UNSIGNED: not installable. Configure LUMENA_SIGNING_BUNDLE and rerun CI, or sign locally with the pinned owner key.\n' > unsigned-input/README.txt
      - name: Upload unsigned signing input
        if: env.LUMENA_SIGNING_BUNDLE == ''
        uses: actions/upload-artifact@v4
        with:
          name: UNSIGNED-Lumena-ci${{ github.run_number }}-signing-input
          path: unsigned-input/
          if-no-files-found: error
